name = "event-couture-api"
main = "index.js"
compatibility_date = "2026-09-01"

[vars]
# Websites allowed to call this server (add the final domain when it's chosen)
ALLOWED_ORIGINS = "https://eventcouture.app,https://www.eventcouture.app,https://facecouture.app,https://www.facecouture.app,https://framephotostudio.github.io,capacitor://localhost,https://localhost"
# About $20 a month across AI and venue lookups; calls stop for the day once reached
DAILY_CAP_USD = "0.66"
GEMINI_MODEL = "gemini-2.5-flash"

# Create once with: wrangler kv namespace create EC_KV   (then paste the id below)
[[kv_namespaces]]
binding = "EC_KV"
id = "REPLACE_WITH_KV_ID"

# Secrets (never stored in this file):
#   wrangler secret put GEMINI_KEY
#   wrangler secret put GOOGLE_MAPS_KEY
