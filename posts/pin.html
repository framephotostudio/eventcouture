<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1000px;height:1500px;background:#2E0B20;overflow:hidden}
.photo{position:absolute;left:0;top:0;width:1000px;height:860px;background-size:cover;background-position:center}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(46,11,32,0) 60%,rgba(46,11,32,1) 100%)}
.ai{position:absolute;left:28px;top:28px;font:500 20px Jost,sans-serif;color:#fff;background:rgba(0,0,0,.45);padding:6px 14px;border-radius:20px;z-index:2}
.panel{position:absolute;left:0;top:800px;width:1000px;height:700px;background:linear-gradient(180deg,#2E0B20,#4A1534);padding:22px 80px 0;text-align:center}
.kick{font:600 24px Jost,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#D8B26E}
h1{font-family:'Bodoni Moda',serif;font-weight:500;font-size:76px;line-height:1.08;color:#FBF3E6;margin:14px 0 18px}
.num{font-family:'Bodoni Moda',serif;font-weight:600;font-size:66px;color:#F0D49A;margin-bottom:10px}
.sub{font:400 30px/1.4 Jost,sans-serif;color:#EAD9C6}
.foot{position:absolute;left:0;bottom:34px;width:1000px;display:flex;flex-direction:column;align-items:center;gap:12px}
.foot img{height:130px}
.url{display:flex;align-items:center;gap:12px;font:500 30px Jost,sans-serif;letter-spacing:.03em;color:#F0D49A;border:1.5px solid rgba(216,178,110,.7);border-radius:40px;padding:10px 26px}.url svg{width:28px;height:28px}
.rule{display:none}
</style></head><body>
<div class="photo" id="ph"><span class="ai">AI-generated inspiration</span></div>
<div class="panel"><div class="kick" id="k"></div><h1 id="t"></h1><div class="num" id="n"></div><div class="sub" id="s"></div></div>
<div class="foot"><div class="rule"></div><img src="pin_logo.png" alt=""><div class="url"><svg viewBox="0 0 24 24" fill="none" stroke="#F0D49A" stroke-width="1.6"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.8 3.9 6 3.9 9.5s-1.3 6.7-3.9 9.5c-2.6-2.8-3.9-6-3.9-9.5S9.4 5.3 12 2.5z"/></svg>https://eventcouture.app</div></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('ph').style.backgroundImage='url('+q.get('img')+')';
document.getElementById('k').textContent=q.get('k')||'';document.getElementById('t').textContent=q.get('t')||'';
const n=q.get('n');document.getElementById('n').textContent=n||'';if(!n)document.getElementById('n').style.display='none';
document.getElementById('s').textContent=q.get('s')||'';
</script></body></html>
