name: Showcase screenshots
# Screenshots of a real package on the live site (live Google results), for showing a vendor how they appear.
on:
  workflow_dispatch:
    inputs:
      city: { description: 'City', default: 'Orange County, CA' }
      row: { description: 'Package line to show', default: 'dj' }
      singer: { description: 'Turn on Singer (any text = yes)', default: '' }
      start: { description: 'Start (arabic-wedding, korean-wedding, birthday...)', default: 'arabic-wedding' }
      text: { description: 'Her words', default: '' }
      name: { description: 'Event name', default: '' }
      guests: { description: 'Guests', default: '200' }
      pkg: { description: 'Package to choose (0 = first, 1 = second)', default: '0' }
      story: { description: 'Make an Instagram story instead (any text = yes)', default: '' }
      pick: { description: 'Story: swap lines, e.g. venue=post oak;florals=!delivery', default: '' }
      remove: { description: 'Story: lines to leave out, e.g. Live music,Bartender', default: '' }
      names: { description: 'Story: set a line by name, e.g. Cake and desserts=Three Brothers Bakery', default: '' }
permissions: { contents: write }
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node tools/${{ inputs.story && 'story' || 'showcase' }}.mjs
        env: { CITY: '${{ inputs.city }}', ROW: '${{ inputs.row }}', SINGER: '${{ inputs.singer }}', START: '${{ inputs.start }}', TEXT: '${{ inputs.text }}', NAME: '${{ inputs.name }}', GUESTS: '${{ inputs.guests }}', PKG: '${{ inputs.pkg }}', PICK: '${{ inputs.pick }}', REMOVE: '${{ inputs.remove }}', NAMES: '${{ inputs.names }}' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: showcase, path: showcase }
      - name: Save them to the showcase branch
        if: always()
        run: |
          git config user.name "Event Couture build"; git config user.email "build@facecouture.app"
          git checkout --orphan showcase-out && git rm -rq --cached . && git add showcase && git commit -qm "Showcase screenshots" && git push -f origin HEAD:showcase-out
