name: Build Event Couture apps
# Test builds on every push to mobile-app: an Android test app (.apk) and an iPhone simulator build with screenshots.
on:
  push:
    branches: [mobile-app]
    paths-ignore: ['release/**', 'store/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
env:
  DEPS: "@capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/ios@7 @capacitor/splash-screen@7 @capacitor/status-bar@7 @capacitor/share@7 @capacitor/haptics@7 @capacitor/app@7 @capacitor/network@7 @capacitor/browser@7 @capacitor/filesystem@7"
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install $DEPS
      - run: npm install @capacitor-community/in-app-review@7 || echo 'review prompt skipped'
      - run: npm run build:web
        env: { APP_VERSION: '1.0.0' }
      - run: npx cap add android && bash scripts/native-setup.sh android && npx cap sync android
        env: { APP_VERSION: '1.0.0', BUILD_NUMBER: '${{ github.run_number }}' }
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: event-couture-android-test, path: android/app/build/outputs/apk/debug/*.apk }
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1); sudo xcode-select -s "$X"; xcodebuild -version
      - run: npm install $DEPS
      - run: npm install @capacitor-community/in-app-review@7 || echo 'review prompt skipped'
      - run: npm run build:web
        env: { APP_VERSION: '1.0.0', EC_SHOT_TOUR: '1' }
      - run: npx cap add ios && bash scripts/native-setup.sh ios && npx cap sync ios
        env: { APP_VERSION: '1.0.0', BUILD_NUMBER: '${{ github.run_number }}' }
      - name: Build for iPhone simulator (no signing)
        run: |
          set -o pipefail
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Open it on a simulated iPhone and take screenshots
        run: |
          DEV=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-9]|iPhone 2[0-9]' | grep -v -i 'plus\|max\|mini\|SE\|air' | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulator $DEV"; xcrun simctl boot "$DEV" || true; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          mkdir -p shots; xcrun simctl launch "$DEV" app.facecouture.events
          # test builds walk through the main screens by themselves (EC_SHOT_TOUR), 15 seconds each
          sleep 7; for n in 1-home 2-inspiration 3-plan 4-sample-plan 5-get-this-look 6-my-events; do xcrun simctl io "$DEV" screenshot "shots/$n.png"; sleep 15; done
          xcrun simctl spawn "$DEV" log show --last 4m --style compact --predicate 'process == "App"' 2>/dev/null | tail -c 40000 > shots/app-log-tail.txt || true
      - name: Publish screenshots to the ci-output branch for review
        if: always()
        run: |
          mkdir -p /tmp/out; cp shots/* /tmp/out/ 2>/dev/null || echo none > /tmp/out/none.txt
          git config user.name event-couture-ci; git config user.email hello@facecouture.app
          git checkout --orphan ci-shots; git rm -rfq --cached . ; rm -rf out; mkdir out; cp /tmp/out/* out/
          git add -f out; git commit -qm "iOS simulator screenshots, run ${{ github.run_number }}"; git push -qf origin HEAD:ci-output
