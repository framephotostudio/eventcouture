name: Review alert
# Every hour: if a review is waiting for approval, GitHub emails the owner (through an issue that mentions her).
# The issue never shows the review itself or the admin code: this repository is public. Free, no extra accounts.
on:
  schedule: [ { cron: '23 * * * *' } ]
  workflow_dispatch: {}
permissions: { issues: write, contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Look for reviews waiting for approval
        env:
          CODE: ${{ secrets.ADMIN_CODE }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          API: https://event-couture-api.facecouture.workers.dev
        run: |
          CODE=$(printf '%s' "$CODE" | tr -d '[:space:]')
          if [ -z "$CODE" ]; then echo "No ADMIN_CODE secret, nothing to check."; exit 0; fi
          body=$(curl -s -m 30 -H "x-admin-code: $CODE" "$API/api/reviews/all") || { echo "Server not reachable"; exit 0; }
          n=$(printf '%s' "$body" | jq '[.reviews[]? | select(.status == "pending")] | length' 2>/dev/null || echo "")
          if [ -z "$n" ]; then echo "Could not read reviews."; exit 0; fi
          echo "Waiting: $n"
          gh label create review-alert --color B69A68 --description "A review is waiting for approval" --force >/dev/null
          open=$(gh issue list --label review-alert --state open --json number,title --jq '.[0] // empty')
          num=$(printf '%s' "$open" | jq -r '.number // empty'); was=$(printf '%s' "$open" | jq -r '.title // ""' | grep -oE '^[0-9]+' || echo 0)
          word() { [ "$1" = 1 ] && echo "review is" || echo "reviews are"; }
          msg="@framephotostudio $n new $(word $n) waiting for your approval on Event Couture.

          Open https://eventcouture.app/#/admin/reviews and type your admin code to read and approve. Approve every honest review, including low ratings.

          This message closes by itself once nothing is waiting."
          msg=$(printf '%s' "$msg" | sed 's/^          //')
          if [ "$n" -gt 0 ] && [ -z "$num" ]; then
            gh issue create --title "$n new $(word $n | cut -d' ' -f1) waiting for approval" --label review-alert --body "$msg"
          elif [ "$n" -gt 0 ] && [ "$n" -gt "${was:-0}" ]; then
            gh issue edit "$num" --title "$n new $(word $n | cut -d' ' -f1) waiting for approval"
            gh issue comment "$num" --body "$msg"
          elif [ "$n" -eq 0 ] && [ -n "$num" ]; then
            gh issue close "$num" --comment "All reviews are handled. Nothing is waiting."
          fi
