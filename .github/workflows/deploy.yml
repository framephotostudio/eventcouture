# Deploys Event Couture on every push to main:
#   1. the small server (Cloudflare Worker) with the AI and Maps keys
#   2. the website (GitHub Pages), pointed at that server
# Needs four repository secrets: GEMINI_KEY, GOOGLE_MAPS_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.pages.outputs.page_url }}' }
    steps:
      - name: Load keys (spaces and line breaks removed)
        run: |
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do v=$(printf '%s' "${!s}" | tr -d '[:space:]'); echo "::add-mask::$v"; echo "$s=$v" >> $GITHUB_ENV; done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confirm the Cloudflare account (uses the token's own account if the saved ID doesn't match)
        run: |
          ids=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);if(!j.success){console.error('Token check failed: '+JSON.stringify(j.errors));process.exit(0)}console.log(j.result.map(a=>a.id).join(' '))}catch(e){}})")
          echo "Accounts this token can use: $(echo $ids | wc -w)"
          if [ -n "$ids" ] && ! echo " $ids " | grep -q " $CLOUDFLARE_ACCOUNT_ID "; then
            first=$(echo $ids | cut -d' ' -f1); echo "::add-mask::$first"; echo "CLOUDFLARE_ACCOUNT_ID=$first" >> $GITHUB_ENV
            echo "::warning::The saved CLOUDFLARE_ACCOUNT_ID did not match; using the token's account instead."
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check secrets are saved
        run: |
          missing=""
          for s in GEMINI_KEY GOOGLE_MAPS_KEY; do [ -z "${!s}" ] && missing="$missing $s"; done
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"; [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then echo "::warning::Missing secrets:$missing. The site will deploy in preview mode without the server."; echo "SERVER=no" >> $GITHUB_ENV; else echo "SERVER=yes" >> $GITHUB_ENV; fi
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
      - name: Server storage (create once)
        if: env.SERVER == 'yes'
        working-directory: worker
        run: |
          id=$(npx -y wrangler@3 kv namespace list | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const n=JSON.parse(d).find(x=>/EC_KV/.test(x.title));console.log(n?n.id:'')})")
          if [ -z "$id" ]; then id=$(npx -y wrangler@3 kv namespace create EC_KV | grep -oE '[0-9a-f]{32}' | head -1); fi
          sed -i "s/REPLACE_WITH_KV_ID/$id/" wrangler.toml
      - name: Deploy server
        if: env.SERVER == 'yes'
        id: worker
        working-directory: worker
        run: |
          origin="https://${{ github.repository_owner }}.github.io"
          sed -i "s#ALLOWED_ORIGINS = \"#ALLOWED_ORIGINS = \"$origin,#" wrangler.toml
          npx -y wrangler@3 deploy | tee out.txt
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' out.txt | head -1)
          echo "url=$url" >> $GITHUB_OUTPUT
          printf '%s' "${{ secrets.GEMINI_KEY }}" | tr -d '[:space:]' | npx -y wrangler@3 secret put GEMINI_KEY
          printf '%s' "${{ secrets.GOOGLE_MAPS_KEY }}" | tr -d '[:space:]' | npx -y wrangler@3 secret put GOOGLE_MAPS_KEY
          if [ -n "${{ secrets.ADMIN_CODE }}" ]; then printf '%s' "${{ secrets.ADMIN_CODE }}" | tr -d '[:space:]' | npx -y wrangler@3 secret put ADMIN_CODE; else echo "No ADMIN_CODE secret yet: the email list download stays off."; fi
      - name: Bot check for forms (Cloudflare Turnstile, free; skipped if the token can't manage Turnstile)
        if: env.SERVER == 'yes'
        continue-on-error: true
        working-directory: worker
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets"; auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          key=$(curl -s -H "$auth" "$api?per_page=50" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);if(!j.success){console.error(JSON.stringify(j.errors));return}const w=j.result.find(x=>x.name==='Event Couture forms');console.log(w?w.sitekey:'')}catch(e){}})")
          if [ -z "$key" ]; then
            key=$(curl -s -X POST -H "$auth" -H "content-type: application/json" "$api" -d '{"name":"Event Couture forms","domains":["eventcouture.app","www.eventcouture.app","localhost"],"mode":"managed"}' | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);if(!j.success){console.error(JSON.stringify(j.errors));return}console.log(j.result.sitekey)}catch(e){}})")
          fi
          if [ -z "$key" ]; then echo "::warning::Turnstile not set up: the Cloudflare token needs the 'Turnstile Sites: Edit' permission. Forms still work without it."; echo y | npx -y wrangler@3 secret delete TURNSTILE_SECRET >/dev/null 2>&1 || true; exit 0; fi
          sec=$(curl -s -H "$auth" "$api/$key" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).result.secret||'')}catch(e){}})")
          echo "::add-mask::$sec"
          if [ -n "$sec" ] && printf '%s' "$sec" | npx -y wrangler@3 secret put TURNSTILE_SECRET; then echo "TS_SITEKEY=$key" >> $GITHUB_ENV; else echo y | npx -y wrangler@3 secret delete TURNSTILE_SECRET >/dev/null 2>&1 || true; fi
      - name: Point the site at the server
        if: env.SERVER == 'yes'
        run: |
          sed -i "s#apiUrl: ''#apiUrl: '${{ steps.worker.outputs.url }}'#" js/config.js
          [ -n "$TS_SITEKEY" ] && sed -i "s#turnstile: ''#turnstile: '$TS_SITEKEY'#" js/config.js || true   # stays in preview mode for payments until real checkout exists
          cat js/config.js
      - name: Package site
        run: mkdir _site && cp -r index.html manifest.json css js img _site/
      - name: Planning guides for search engines (one page per city and per occasion, plus a sitemap)
        run: node tools/seo.cjs _site
      - name: Serve the brand fonts from our own site (faster first paint)
        run: node tools/fonts.cjs _site
      - name: Make returning visitors load this version's files (no old and new files mixed)
        run: |
          v=$(git rev-parse --short HEAD)
          sed -i -E "s#(src|href)=\"(js/[a-z]+\.js|css/app\.css)\"#\1=\"\2?v=$v\"#g" _site/index.html
          grep -E 'js/|css/' _site/index.html
      - name: Send every visitor to the secure (https) address
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "Enforce HTTPS: %{http_code}\n" -X PUT -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages" -d '{"https_enforced":true}'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: pages
        uses: actions/deploy-pages@v4
      - name: Check the server answers
        if: env.SERVER == 'yes'
        run: curl -s "${{ steps.worker.outputs.url }}/api/status"
