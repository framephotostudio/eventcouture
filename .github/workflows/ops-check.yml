name: ops-check
on: { push: { branches: [ops-check] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://event-couture-api.facecouture.workers.dev
          curl -s $A/api/status; echo
          for city in "Des Moines, IA" "Boise, ID" "Albuquerque, NM"; do
            for q in "mobile bartending service|bartender" "bartender for hire|bartender"; do
              Q="${q%%|*}"; C="${q##*|}"
              n=$(curl -s -X POST $A/api/places -H 'content-type: application/json' -H 'origin: https://eventcouture.app' -d "{\"query\":\"$Q\",\"city\":\"$city\",\"kind\":\"vendor\",\"cat\":\"$C\",\"level\":\"S\"}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('places',[])) if 'places' in d else 'ERR '+d.get('error',''))")
              echo "RES $city | $C | $n"
            done
          done
          curl -s $A/api/status; echo
