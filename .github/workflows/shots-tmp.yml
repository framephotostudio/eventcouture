name: shots-tmp
on: { push: { branches: [shots-tmp] } }
permissions: { contents: write }
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -s https://event-couture-api.facecouture.workers.dev/api/status > status-before.json; cat status-before.json
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python .github/shots.py
      - if: always()
        run: |
          mkdir -p out; curl -s https://event-couture-api.facecouture.workers.dev/api/status > out/status-after.json; cp status-before.json out/
          git config user.name shots; git config user.email shots@users.noreply.github.com
          git add -f out && git commit -qm "screenshots [skip ci]" && git push -q origin HEAD:shots-tmp
