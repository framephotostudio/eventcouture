name: Social post
# Renders the social post and story from the post-src branch with the brand fonts, and saves the images to the showcase-out branch.
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: post-src }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node shoot.mjs
      - name: Save
        run: |
          git config user.name "Event Couture build"; git config user.email "build@facecouture.app"
          git checkout --orphan showcase-out && git rm -rq --cached . && git add showcase && git commit -qm "Social post" && git push -f origin HEAD:showcase-out
